<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Glowing Tinder Flame Icon -->
  <g transform="translate(136, 116)" filter="url(#glow)">
    <path d="M120 0 C125 45, 90 75, 75 105 C60 135, 60 165, 80 195 C55 180, 45 155, 45 130 C45 125, 40 120, 35 125 C15 155, 0 195, 0 240 C0 306, 54 360, 120 360 C186 360, 240 306, 240 240 C240 160, 175 90, 120 0 Z" fill="url(#flameGrad)"/>
    <path d="M120 180 C105 210, 80 230, 80 260 C80 282, 98 300, 120 300 C142 300, 160 282, 160 260 C160 220, 135 200, 120 180 Z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
